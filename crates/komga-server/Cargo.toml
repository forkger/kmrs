[package]
name = "komga-server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "kmrs"
path = "src/main.rs"

[features]
# jemalloc global allocator + SIGUSR2 heap dumps (src/profiling.rs); profiling builds only
profiling = ["dep:tikv-jemallocator", "dep:tikv-jemalloc-ctl"]

[dependencies]
clap.workspace = true
toml.workspace = true
serde_yaml.workspace = true
komga-core = { path = "../komga-core" }
komga-db = { path = "../komga-db" }
komga-media = { path = "../komga-media" }
komga-search = { path = "../komga-search" }
tokio.workspace = true
axum = { workspace = true, features = ["multipart"] }
tower = { workspace = true, features = ["util"] }
tower-http.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
anyhow.workspace = true
libc.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
time.workspace = true
bcrypt.workspace = true
sha2.workspace = true
hex.workspace = true
md5.workspace = true
uuid.workspace = true
moka.workspace = true
form_urlencoded.workspace = true
scraper.workspace = true
base64 = "0.23"
zip.workspace = true
image.workspace = true
rusqlite.workspace = true
crc32fast.workspace = true
tokio-util = { version = "0.7", features = ["io"] }
tokio-stream = "0.1"
futures-util = "0.3"
http-body = "1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["server-graceful", "http1", "tokio"] }
flate2.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "json", "gzip", "stream"] }
# debug-embed: debug builds embed at compile time too — the shipped binary never reads
# webui/dist at runtime, so the docker smoke test works with a dev-profile build
rust-embed = { version = "8.12.0", features = ["mime-guess", "debug-embed"] }
sysinfo.workspace = true
semver = "1"
ipnet = "2"
async-trait = "0.1"

# unix-only: the `profiling` feature is inert on Windows (jemalloc has no MSVC support),
# so release builds can pass --features profiling to every target
[target.'cfg(unix)'.dependencies]
tikv-jemalloc-ctl = { workspace = true, optional = true }
# The whole process must share one allocator: a prefixed jemalloc would sit next to
# the system allocator, and one cross-boundary free corrupts the heap. Bundled SQLite
# binds the unprefixed symbols at static link time, dlopen'd libpdfium via the
# exported dynamic symbols (.cargo/config.toml adds -rdynamic on linux-gnu).
# Overriding also routes C-side churn (SQLite, pdfium) through jemalloc's decay —
# glibc never returns arena-interior free pages, so that churn ratchets RSS.
# macOS overrides via zone_register, linux-gnu via unprefixed symbols.
tikv-jemallocator = { workspace = true, optional = true, features = ["override_allocator_on_supported_platforms"] }

# ungated on purpose: build.rs decides from CARGO_CFG_TARGET_OS — it runs on the
# host, so a #[cfg(windows)] guard would never fire when cross-checking
[build-dependencies]
embed-resource = "3"

[target.'cfg(windows)'.dependencies]
tray-icon = { version = "0.26", default-features = false }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_Registry",
    "Win32_System_StationsAndDesktops",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
tray-icon = { version = "0.26", default-features = false }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "libc",
    "NSAlert",
    "NSApplication",
    "NSAttributedString",
    "NSColor",
    "NSEvent",
    "NSFont",
    "NSGraphicsContext",
    "NSMenu",
    "NSMenuItem",
    "NSParagraphStyle",
    "NSResponder",
    "NSRunningApplication",
    "NSText",
    "NSWindow",
    "NSWorkspace",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSAttributedString",
    "NSDate",
    "NSDictionary",
    "NSGeometry",
    "NSObject",
    "NSProcessInfo",
    "NSRange",
    "NSString",
] }
dispatch2 = { version = "0.3", default-features = false, features = ["std"] }
objc2-service-management = { version = "0.3", default-features = false, features = [
    "std",
    "SMAppService",
    "objc2",
    "objc2-foundation",
] }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
tempfile = "3"

[dev-dependencies]
tower = { workspace = true, features = ["util"] }
tempfile = "3"
http-body-util = "0.1"
